<link rel="stylesheet" href="./assets/index-Cnb-RC22.css"> 
<style> 
body{margin:0;min-height:100vh;background:#0f1719;color:#eef5f4;font-family:Inter,system-ui,sans-serif}

<body> 
<div class="wrap"><div class="card"> 
<div class="brand">◆ Sahayak Desk</div> 
<h1>Create an Admin Account</h1> 
<p class="muted">A new administrator will be saved in MongoDB Atlas. After signup, you can proceed to the Admin Dashboard.</p> 
<form id="f"> 
<label>Name</label><input id="name" required minlength="2" placeholder="Your name"> 
<label>Email</label><input id="email" type="email" required placeholder="admin@example.com"> 
<label>Password</label><input id="password" type="password" required minlength="6" placeholder="Minimum 6 characters">

</form> 
<p style="margin-top:18px"><a href="./tickets">← Back to Admin Login</a></p> 
<p class="muted" style="margin-top:10px">This page is only for creating an Admin account. Customers do not need to sign up.</p> 
</div></div>

<script> 
const f=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('btn'); 
const nameInput=document.getElementById('name'); 
const emailInput=document.getElementById('email'); 
const passwordInput=document.getElementById('password'); 
 
async function checkServer(){ 
  try{ 
    const r=await fetch('/api/health',{cache:'no-store'}); 
    if(!r.ok) throw new Error('Server response error'); 
    const d=await r.json(); 
    if(!d.db) throw new Error('MongoDB is not connected'); 
  }catch(e){ 
    msg.textContent='Server/MongoDB is not ready. Please start Sahayak Desk first.'; 
    msg.style.display='block'; 
    msg.style.color='#f6b6b6'; 
    btn.disabled=true; 
  } 
} 
checkServer(); 
f.addEventListener('submit',async e=>{ 
 e.preventDefault();msg.style.display='none';btn.disabled=true;btn.textContent='Creating account…'; 
 try{ 
  const r=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'}, 
   body:JSON.stringify({name:nameInput.value.trim(),email:emailInput.value.trim(),password:passwordInput.value})}); 
  const d=await r.json(); if(!r.ok) throw new Error(d.message||('Signup failed ('+r.status+')')); 
  // Immediately verify the newly created account with the same API used by login. 
  const lr=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailInput.value.trim(),password:passwordInput.value})}); 
  const ld=await lr.json(); 
  if(!lr.ok) throw new Error('Account was created, but login verification failed: '+(ld.message||'login failed')); 
  localStorage.setItem('sahayak_agent',JSON.stringify(ld)); 
  msg.textContent='Admin account created and logged in. Opening dashboard…';msg.style.display='block'; 
  setTimeout(()=>location.href='/',300); 
 }catch(x){msg.textContent=x.message;msg.style.display='block'}finally{btn.disabled=false;btn.textContent='Create Admin Account'} 
}); 
</script>

</body></html>
